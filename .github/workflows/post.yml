name: Facebook Auto Post

on:
  schedule:
    - cron: '0 6 * * 2'    # Tuesday   08:00 Sofia — ITA COM post
    - cron: '0 6 * * 5'    # Friday    08:00 Sofia — ITA COM post
    - cron: '0 7 * * 3'    # Wednesday 09:00 Sofia — Instagram post
    - cron: '0 7 * * 6'    # Saturday  09:00 Sofia — Instagram post
    - cron: '0 9 * * 1'    # Monday    11:00 Sofia — Partner news
    - cron: '0 9 * * 4'    # Thursday  11:00 Sofia — Partner news
    - cron: '*/30 * * * *' # Every 30 min — check & reply to comments
  workflow_dispatch:
    inputs:
      post_type:
        description: 'What to post: itacom, partner, instagram, or comments'
        required: false
        default: 'itacom'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download font
        run: |
          curl -fL "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2" -o dejavu.tar.bz2
          tar -xjf dejavu.tar.bz2 dejavu-fonts-ttf-2.37/ttf/DejaVuSans-Bold.ttf
          mv dejavu-fonts-ttf-2.37/ttf/DejaVuSans-Bold.ttf .

      - name: Refresh page token
        id: token
        env:
          SYSTEM_USER_TOKEN: ${{ secrets.SYSTEM_USER_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: |
          PAGE_TOKEN=$(python get_page_token.py)
          echo "page_token=$PAGE_TOKEN" >> $GITHUB_OUTPUT

      - name: Determine post type
        id: type
        run: |
          INPUT="${{ github.event.inputs.post_type }}"
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$INPUT" ]; then
            echo "type=$INPUT" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 6 * * 2" ] || [ "$SCHEDULE" = "0 6 * * 5" ]; then
            echo "type=itacom" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 7 * * 3" ] || [ "$SCHEDULE" = "0 7 * * 6" ]; then
            echo "type=instagram" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 9 * * 1" ] || [ "$SCHEDULE" = "0 9 * * 4" ]; then
            echo "type=partner" >> $GITHUB_OUTPUT
          else
            echo "type=comments" >> $GITHUB_OUTPUT
          fi

      - name: Post ITA COM content
        if: steps.type.outputs.type == 'itacom'
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ steps.token.outputs.page_token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot.py

      - name: Post partner news
        if: steps.type.outputs.type == 'partner'
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ steps.token.outputs.page_token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python partner_bot.py

      - name: Post to Instagram
        if: steps.type.outputs.type == 'instagram'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ steps.token.outputs.page_token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python instagram_bot.py

      - name: Reply to comments
        if: steps.type.outputs.type == 'comments'
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ steps.token.outputs.page_token }}
        run: python comment_bot.py
